<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test Supabase</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Test Connexion Supabase</h1>
    <div id="result">Test en cours...</div>
    
    <script>
        const SUPABASE_URL = "https://tgossdjwafoqvtijibdv.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRnb3NzZGp3YWZvcXZ0aWppYmR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0NDczMjYsImV4cCI6MjA5MjAyMzMyNn0.IHZ3uMOMobrxk05FnT1v4lqdOZIHuFWc1ZYRVVzkxZ0";
        
        async function test() {
            const resultDiv = document.getElementById("result");
            
            try {
                resultDiv.innerHTML = "1️⃣ Création du client...<br>";
                const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                
                resultDiv.innerHTML += "2️⃣ Client créé, tentative de lecture...<br>";
                const { data, error } = await supabase.from('dossiers').select('*');
                
                if (error) {
                    resultDiv.innerHTML += "❌ ERREUR: " + error.message + "<br>";
                    resultDiv.innerHTML += "📋 Code: " + error.code + "<br>";
                } else {
                    resultDiv.innerHTML += "✅ SUCCÈS! Données reçues: " + data.length + " dossiers<br>";
                    resultDiv.innerHTML += "<pre>" + JSON.stringify(data, null, 2) + "</pre>";
                }
                
            } catch(err) {
                resultDiv.innerHTML += "❌ EXCEPTION: " + err.message + "<br>";
            }
        }
        
        test();
    </script>
</body>
</html>
