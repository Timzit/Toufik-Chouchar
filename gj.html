<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>LeadFlow Pro - Plateforme de Gestion des Prospects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --secondary: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --dark: #0f172a;
            --gray-800: #1e293b;
            --gray-700: #334155;
            --gray-600: #475569;
            --gray-500: #64748b;
            --gray-400: #94a3b8;
            --gray-200: #e2e8f0;
            --gray-100: #f1f5f9;
            --white: #ffffff;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
            --radius: 1rem;
            --radius-lg: 1.5rem;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: var(--dark);
        }

        /* Glassmorphism Effect */
        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
        }

        /* Dashboard Layout */
        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.5rem;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding: 1rem 2rem;
            background: rgba(255, 255, 255, 0.98);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            animation: slideDown 0.5s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .logo i {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 1.8rem;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .avatar:hover {
            transform: scale(1.05);
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: white;
            padding: 1.5rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            animation: fadeInUp 0.5s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-xl);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .stat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .stat-title {
            color: var(--gray-600);
            font-size: 0.875rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 0.5rem;
        }

        .stat-change {
            font-size: 0.875rem;
            color: var(--gray-500);
        }

        .stat-change.positive {
            color: var(--secondary);
        }

        /* Actions Bar */
        .actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .search-box {
            flex: 1;
            max-width: 400px;
            position: relative;
        }

        .search-box i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-400);
        }

        .search-box input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            border: 2px solid var(--gray-200);
            border-radius: var(--radius);
            font-size: 0.875rem;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-family: inherit;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        /* Table */
        .table-container {
            background: white;
            border-radius: var(--radius);
            overflow-x: auto;
            box-shadow: var(--shadow);
            animation: fadeInUp 0.6s ease;
        }

        .leads-table {
            width: 100%;
            border-collapse: collapse;
        }

        .leads-table thead {
            background: linear-gradient(135deg, var(--gray-100), var(--white));
        }

        .leads-table th {
            padding: 1rem;
            text-align: left;
            font-weight: 600;
            color: var(--gray-700);
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            user-select: none;
        }

        .leads-table td {
            padding: 1rem;
            border-top: 1px solid var(--gray-200);
            color: var(--gray-700);
        }

        .leads-table tbody tr {
            transition: all 0.3s ease;
        }

        .leads-table tbody tr:hover {
            background: var(--gray-100);
            transform: scale(1.01);
        }

        /* Status Badges */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.75rem;
            border-radius: 2rem;
            font-size: 0.75rem;
            font-weight: 600;
            gap: 0.25rem;
        }

        .badge-new {
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary);
        }

        .badge-contacted {
            background: rgba(16, 185, 129, 0.1);
            color: var(--secondary);
        }

        .badge-qualified {
            background: rgba(245, 158, 11, 0.1);
            color: var(--warning);
        }

        .badge-closed {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--gray-500);
            transition: all 0.3s ease;
            padding: 0.25rem;
            border-radius: 0.25rem;
        }

        .action-btn:hover {
            color: var(--primary);
            transform: scale(1.1);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 2rem;
            border-radius: var(--radius-lg);
            max-width: 500px;
            width: 90%;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translate(-50%, -40%);
                opacity: 0;
            }
            to {
                transform: translate(-50%, -50%);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-header h3 {
            font-size: 1.5rem;
            color: var(--dark);
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--gray-500);
            transition: color 0.3s ease;
        }

        .close-modal:hover {
            color: var(--danger);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--gray-700);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid var(--gray-200);
            border-radius: var(--radius);
            font-size: 0.875rem;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .dashboard {
                padding: 1rem;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .actions-bar {
                flex-direction: column;
            }

            .search-box {
                max-width: 100%;
            }

            .leads-table th,
            .leads-table td {
                padding: 0.75rem;
            }

            .action-buttons {
                flex-direction: column;
            }
        }

        /* Loading Animation */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Tooltip */
        [data-tooltip] {
            position: relative;
            cursor: pointer;
        }

        [data-tooltip]:before {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            padding: 0.5rem;
            background: var(--dark);
            color: white;
            font-size: 0.75rem;
            border-radius: 0.25rem;
            white-space: nowrap;
            display: none;
            z-index: 100;
        }

        [data-tooltip]:hover:before {
            display: block;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--gray-100);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-dark);
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <!-- Header -->
        <div class="header">
            <div class="logo">
                <i class="fas fa-chart-line"></i>
                <span>FT-ECH</span>
                    <p>Gestion des prospects</p>
            </div>
            <div class="user-info">
                <span>Bienvenue, Fedoua</span>
                <div class="avatar" data-tooltip="Profil utilisateur">
                    <i class="fas fa-user"></i>
                </div>
            </div>
        </div>

        <!-- Stats Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-header">
                    <span class="stat-title">Total Prospects</span>
                    <div class="stat-icon">
                        <i class="fas fa-users"></i>
                    </div>
                </div>
                <div class="stat-value" id="totalLeads">0</div>
                <div class="stat-change positive">
                    <i class="fas fa-arrow-up"></i> +12% ce mois
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-header">
                    <span class="stat-title">Nouveaux</span>
                    <div class="stat-icon">
                        <i class="fas fa-user-plus"></i>
                    </div>
                </div>
                <div class="stat-value" id="newLeads">0</div>
                <div class="stat-change positive">
                    <i class="fas fa-arrow-up"></i> +5% cette semaine
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-header">
                    <span class="stat-title">Contactés</span>
                    <div class="stat-icon">
                        <i class="fas fa-phone-alt"></i>
                    </div>
                </div>
                <div class="stat-value" id="contactedLeads">0</div>
                <div class="stat-change">
                    <i class="fas fa-chart-line"></i> Taux de contact 68%
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-header">
                    <span class="stat-title">Qualifiés</span>
                    <div class="stat-icon">
                        <i class="fas fa-star"></i>
                    </div>
                </div>
                <div class="stat-value" id="qualifiedLeads">0</div>
                <div class="stat-change positive">
                    <i class="fas fa-arrow-up"></i> +8% conversion
                </div>
            </div>
        </div>

        <!-- Actions Bar -->
        <div class="actions-bar">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Rechercher un prospect...">
            </div>
            <button class="btn-primary" id="addLeadBtn">
                <i class="fas fa-plus"></i>
                Ajouter un prospect
            </button>
        </div>

        <!-- Leads Table -->
        <div class="table-container">
            <table class="leads-table">
                <thead>
                    <tr>
                        <th data-sort="name">Nom <i class="fas fa-sort"></i></th>
                        <th data-sort="email">Email <i class="fas fa-sort"></i></th>
                        <th data-sort="company">Entreprise <i class="fas fa-sort"></i></th>
                        <th data-sort="status">Statut <i class="fas fa-sort"></i></th>
                        <th data-sort="date">Date <i class="fas fa-sort"></i></th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="leadsTableBody">
                    <!-- Les données seront insérées ici dynamiquement -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Ajouter/Modifier -->
    <div id="leadModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Ajouter un prospect</h3>
                <button class="close-modal">&times;</button>
            </div>
            <form id="leadForm">
                <input type="hidden" id="leadId">
                <div class="form-group">
                    <label>Nom complet *</label>
                    <input type="text" id="leadName" required>
                </div>
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" id="leadEmail" required>
                </div>
                <div class="form-group">
                    <label>Entreprise</label>
                    <input type="text" id="leadCompany">
                </div>
                <div class="form-group">
                    <label>Téléphone</label>
                    <input type="tel" id="leadPhone">
                </div>
                <div class="form-group">
                    <label>Statut</label>
                    <select id="leadStatus">
                        <option value="Nouveau">Nouveau</option>
                        <option value="Contacté">Contacté</option>
                        <option value="Qualifié">Qualifié</option>
                        <option value="Perdu">Perdu</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Notes</label>
                    <textarea id="leadNotes" rows="3"></textarea>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">
                    <i class="fas fa-save"></i> Enregistrer
                </button>
            </form>
        </div>
    </div>

    <script>
        // Données mockées
        let leads = [
            { id: 1, name: "Amel Bounafer", email: "Amel.Bounafer@email.com", company: "Tech Solutions", phone: "0612345678", status: "Nouveau", notes: "Contact initial positif", date: "2024-01-15" },
            { id: 2, name: "Imad Moncef", email: "Imad.Moncef@email.com", company: "Digital Agency", phone: "0623456789", status: "Contacté", notes: "À rappeler", date: "2024-01-14" },
            { id: 3, name: "Wafa Mohamed", email: "Wafa.Mohamed@email.com", company: "Startup Innov", phone: "0634567890", status: "Qualifié", notes: "Très intéressé", date: "2024-01-13" },
            { id: 4, name: "Nadjib Mouad", email: "Nadjib.Mouad@email.com", company: "Consulting Group", phone: "0645678901", status: "Nouveau", notes: "À contacter", date: "2024-01-12" }
        ];

        let currentEditId = null;

        // Fonction pour mettre à jour les statistiques
        function updateStats() {
            const total = leads.length;
            const newLeads = leads.filter(l => l.status === "Nouveau").length;
            const contactedLeads = leads.filter(l => l.status === "Contacté").length;
            const qualifiedLeads = leads.filter(l => l.status === "Qualifié").length;

            document.getElementById('totalLeads').textContent = total;
            document.getElementById('newLeads').textContent = newLeads;
            document.getElementById('contactedLeads').textContent = contactedLeads;
            document.getElementById('qualifiedLeads').textContent = qualifiedLeads;
        }

        // Fonction pour obtenir la classe du badge
        function getBadgeClass(status) {
            switch(status) {
                case 'Nouveau': return 'badge-new';
                case 'Contacté': return 'badge-contacted';
                case 'Qualifié': return 'badge-qualified';
                default: return 'badge-closed';
            }
        }

        // Fonction pour obtenir l'icône du statut
        function getStatusIcon(status) {
            switch(status) {
                case 'Nouveau': return '<i class="fas fa-user-plus"></i>';
                case 'Contacté': return '<i class="fas fa-phone-alt"></i>';
                case 'Qualifié': return '<i class="fas fa-check-circle"></i>';
                default: return '<i class="fas fa-times-circle"></i>';
            }
        }

        // Fonction pour afficher les leads
        function renderLeads(filter = '') {
            const tbody = document.getElementById('leadsTableBody');
            const filteredLeads = leads.filter(lead => 
                lead.name.toLowerCase().includes(filter.toLowerCase()) ||
                lead.email.toLowerCase().includes(filter.toLowerCase()) ||
                lead.company.toLowerCase().includes(filter.toLowerCase())
            );

            if (filteredLeads.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" style="text-align: center; padding: 3rem;">
                            <i class="fas fa-inbox" style="font-size: 3rem; color: var(--gray-400);"></i>
                            <p style="margin-top: 1rem; color: var(--gray-500);">Aucun prospect trouvé</p>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = filteredLeads.map(lead => `
                <tr>
                    <td><strong>${escapeHtml(lead.name)}</strong></td>
                    <td>${escapeHtml(lead.email)}</td>
                    <td>${escapeHtml(lead.company)}</td>
                    <td>
                        <span class="badge ${getBadgeClass(lead.status)}">
                            ${getStatusIcon(lead.status)} ${lead.status}
                        </span>
                    </td>
                    <td>${formatDate(lead.date)}</td>
                    <td class="action-buttons">
                        <button class="action-btn" onclick="editLead(${lead.id})" data-tooltip="Modifier">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="action-btn" onclick="deleteLead(${lead.id})" data-tooltip="Supprimer">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // Fonction utilitaire pour échapper le HTML
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // Fonction pour formater la date
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }

        // Fonction pour ajouter/modifier un lead
        function saveLead(event) {
            event.preventDefault();
            
            const leadData = {
                name: document.getElementById('leadName').value,
                email: document.getElementById('leadEmail').value,
                company: document.getElementById('leadCompany').value,
                phone: document.getElementById('leadPhone').value,
                status: document.getElementById('leadStatus').value,
                notes: document.getElementById('leadNotes').value,
                date: new Date().toISOString().split('T')[0]
            };

            const id = document.getElementById('leadId').value;
            
            if (id) {
                // Modification
                const index = leads.findIndex(l => l.id == id);
                if (index !== -1) {
                    leads[index] = { ...leads[index], ...leadData };
                }
            } else {
                // Ajout
                const newId = Math.max(...leads.map(l => l.id), 0) + 1;
                leads.push({ id: newId, ...leadData });
            }

            closeModal();
            renderLeads(document.getElementById('searchInput').value);
            updateStats();
        }

        // Fonction pour éditer un lead
        function editLead(id) {
            const lead = leads.find(l => l.id === id);
            if (lead) {
                document.getElementById('modalTitle').textContent = 'Modifier le prospect';
                document.getElementById('leadId').value = lead.id;
                document.getElementById('leadName').value = lead.name;
                document.getElementById('leadEmail').value = lead.email;
                document.getElementById('leadCompany').value = lead.company;
                document.getElementById('leadPhone').value = lead.phone;
                document.getElementById('leadStatus').value = lead.status;
                document.getElementById('leadNotes').value = lead.notes;
                openModal();
            }
        }

        // Fonction pour supprimer un lead
        function deleteLead(id) {
            if (confirm('Êtes-vous sûr de vouloir supprimer ce prospect ?')) {
                leads = leads.filter(l => l.id !== id);
                renderLeads(document.getElementById('searchInput').value);
                updateStats();
            }
        }

        // Gestion du modal
        function openModal() {
            document.getElementById('leadModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('leadModal').style.display = 'none';
            document.getElementById('leadForm').reset();
            document.getElementById('leadId').value = '';
            document.getElementById('modalTitle').textContent = 'Ajouter un prospect';
        }

        // Tri des colonnes
        let sortColumn = null;
        let sortDirection = 'asc';

        function sortTable(column) {
            if (sortColumn === column) {
                sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                sortColumn = column;
                sortDirection = 'asc';
            }

            leads.sort((a, b) => {
                let aVal = a[column];
                let bVal = b[column];
                
                if (sortDirection === 'asc') {
                    return aVal > bVal ? 1 : -1;
                } else {
                    return aVal < bVal ? 1 : -1;
                }
            });

            renderLeads(document.getElementById('searchInput').value);
        }

        // Événements
        document.getElementById('addLeadBtn').addEventListener('click', () => {
            document.getElementById('leadForm').reset();
            document.getElementById('leadId').value = '';
            document.getElementById('modalTitle').textContent = 'Ajouter un prospect';
            openModal();
        });

        document.querySelector('.close-modal').addEventListener('click', closeModal);
        document.getElementById('leadForm').addEventListener('submit', saveLead);
        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderLeads(e.target.value);
        });

        // Ajout des événements de tri
        document.querySelectorAll('[data-sort]').forEach(th => {
            th.addEventListener('click', () => {
                sortTable(th.getAttribute('data-sort'));
            });
        });

        // Fermer le modal en cliquant en dehors
        window.addEventListener('click', (e) => {
            if (e.target === document.getElementById('leadModal')) {
                closeModal();
            }
        });

        // Initialisation
        renderLeads();
        updateStats();
    </script>
</body>
</html>
