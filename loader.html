<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FT-ECH | Loader Pro Animé</title>
    <style>
        /* Reset et style de base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0f1e 0%, #0c1222 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Conteneur principal du loader */
        .loader-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #0b1120 0%, #05070f 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s cubic-bezier(0.23, 1, 0.32, 1), visibility 0.8s;
        }

        .loader-container.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        /* Cercle principal avec effet glassmorphisme */
        .loader-circle {
            position: relative;
            width: 180px;
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Anneau externe tournant */
        .outer-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: #00f2ff;
            border-right-color: #ff00e6;
            border-bottom-color: #ffaa00;
            border-left-color: #00ffaa;
            animation: spin 1.2s linear infinite;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.3), 0 0 40px rgba(255, 0, 230, 0.2);
        }

        /* Anneau interne avec rotation inversée */
        .inner-ring {
            position: absolute;
            width: 70%;
            height: 70%;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: #ff3366;
            border-left-color: #ffcc33;
            border-bottom-color: #33ffcc;
            animation: spin-reverse 0.8s linear infinite;
            filter: drop-shadow(0 0 8px #ff3366);
        }

        /* Cœur du loader avec logo FT-ECH */
        .core {
            position: absolute;
            width: 85px;
            height: 85px;
            background: linear-gradient(135deg, rgba(0, 242, 255, 0.2), rgba(255, 0, 230, 0.2));
            border-radius: 50%;
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            color: white;
            text-shadow: 0 0 15px #00f2ff, 0 0 5px #ff00e6;
            animation: pulse 1.4s ease-in-out infinite;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .ft-text {
            font-size: 20px;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #fff, #00f2ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 800;
        }

        .ech-text {
            font-size: 12px;
            letter-spacing: 3px;
            color: #ffcc33;
            margin-top: 2px;
            font-weight: 500;
        }

        /* Particules flottantes */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            background: radial-gradient(circle, #00f2ff, #ff00e6);
            border-radius: 50%;
            opacity: 0;
            animation: floatParticle 2s ease-in-out infinite;
        }

        /* Texte de chargement stylisé */
        .loading-text {
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.7);
            text-transform: uppercase;
            background: linear-gradient(90deg, #00f2ff, #ff00e6, #00f2ff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shimmer 2s linear infinite;
        }

        .loading-percent {
            font-size: 24px;
            font-weight: 800;
            background: none;
            -webkit-background-clip: unset;
            background-clip: unset;
            color: #fff;
            text-shadow: 0 0 10px #00f2ff;
            margin-top: 8px;
            display: block;
        }

        /* Barre de progression dynamique */
        .progress-bar-container {
            position: absolute;
            bottom: -110px;
            left: 50%;
            transform: translateX(-50%);
            width: 240px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
            backdrop-filter: blur(2px);
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00f2ff, #ff00e6, #ffaa00);
            border-radius: 4px;
            transition: width 0.1s linear;
            box-shadow: 0 0 12px #00f2ff;
            animation: progressGlow 1s ease infinite;
        }

        /* Animations */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes spin-reverse {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-360deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.9; box-shadow: 0 0 0 0 rgba(0,242,255,0.4); }
            50% { transform: scale(1.08); opacity: 1; box-shadow: 0 0 20px 8px rgba(0,242,255,0.3); }
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(0) scale(0);
                opacity: 0;
            }
            20% {
                opacity: 0.8;
            }
            80% {
                opacity: 0.5;
            }
            100% {
                transform: translateY(-100px) scale(1.2);
                opacity: 0;
            }
        }

        @keyframes shimmer {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        @keyframes progressGlow {
            0% { filter: brightness(1); }
            50% { filter: brightness(1.4); }
            100% { filter: brightness(1); }
        }

        /* Effet de vague lumineuse autour */
        .glow-pulse {
            position: absolute;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,242,255,0.15), transparent 70%);
            animation: glowExpand 2s ease-out infinite;
            pointer-events: none;
        }

        @keyframes glowExpand {
            0% {
                transform: scale(0.8);
                opacity: 0.6;
            }
            100% {
                transform: scale(1.4);
                opacity: 0;
            }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .loader-circle { width: 150px; height: 150px; }
            .core { width: 70px; height: 70px; }
            .ft-text { font-size: 16px; }
            .loading-text { font-size: 11px; bottom: -50px; }
            .progress-bar-container { width: 200px; bottom: -95px; }
        }
    </style>
</head>
<body>

<div class="loader-container" id="loaderContainer">
    <div class="glow-pulse"></div>
    <div class="loader-circle">
        <div class="outer-ring"></div>
        <div class="inner-ring"></div>
        <div class="core">
            <span class="ft-text">FT</span>
            <span class="ech-text">ECH</span>
        </div>
    </div>
    <div class="loading-text">
        CHARGEMENT SYSTÈME
        <span class="loading-percent" id="percentValue">0%</span>
    </div>
    <div class="progress-bar-container">
        <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="particles" id="particlesContainer"></div>
</div>

<script>
    (function() {
        // Création des particules dynamiques
        const particlesContainer = document.getElementById('particlesContainer');
        const PARTICLE_COUNT = 35;
        
        function createParticles() {
            for(let i = 0; i < PARTICLE_COUNT; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                const size = Math.random() * 5 + 2;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                const duration = Math.random() * 2 + 1.5;
                const delay = Math.random() * 3;
                particle.style.animation = `floatParticle ${duration}s ease-in-out ${delay}s infinite`;
                particlesContainer.appendChild(particle);
            }
        }
        
        createParticles();
        
        // Simulation de chargement réaliste avec progression fluide
        const loaderContainer = document.getElementById('loaderContainer');
        const percentElement = document.getElementById('percentValue');
        const progressFill = document.getElementById('progressFill');
        
        let progress = 0;
        const targetProgress = 100;
        const duration = 2800; // 2.8 secondes pour un effet pro mais pas trop long
        const intervalTime = 20; // mise à jour toutes les 20ms
        const steps = duration / intervalTime;
        const increment = targetProgress / steps;
        
        // Effet de vibration subtile sur le texte du pourcentage
        function updateProgress() {
            if (progress < targetProgress) {
                progress += increment;
                if (progress > targetProgress) progress = targetProgress;
                const percentInt = Math.floor(progress);
                percentElement.innerText = percentInt + '%';
                progressFill.style.width = progress + '%';
                
                // Variation d'opacité du loader selon avancement
                if (percentInt > 70) {
                    document.querySelector('.glow-pulse').style.opacity = '0.8';
                }
                
                setTimeout(updateProgress, intervalTime);
            } else {
                // Fin du chargement : disparition élégante du loader
                setTimeout(() => {
                    loaderContainer.classList.add('fade-out');
                    // Optionnel : déclencher un événement ou afficher le contenu principal
                    setTimeout(() => {
                        loaderContainer.style.display = 'none';
                        // Vous pouvez ici lancer votre application ou afficher le contenu principal
                        showMainContent();
                    }, 800);
                }, 200);
            }
        }
        
        // Fonction pour afficher le contenu principal après le loader
        function showMainContent() {
            // Créer dynamiquement le contenu principal si nécessaire
            const mainDiv = document.createElement('div');
            mainDiv.style.textAlign = 'center';
            mainDiv.style.color = 'white';
            mainDiv.style.fontFamily = "'Poppins', sans-serif";
            mainDiv.style.padding = '2rem';
            mainDiv.style.animation = 'fadeInUp 0.8s ease-out';
            mainDiv.innerHTML = `
                <div style="background: rgba(255,255,255,0.05); backdrop-filter: blur(12px); border-radius: 32px; padding: 3rem; border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 25px 45px rgba(0,0,0,0.3);">
                    <h1 style="font-size: 3rem; background: linear-gradient(135deg, #00f2ff, #ff00e6); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 1rem;">FT-ECH SYSTEM</h1>
                    <p style="font-size: 1.2rem; opacity: 0.9; letter-spacing: 1px;">Interface prête • Expérience immersive</p>
                    <div style="margin-top: 2rem; width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, #00f2ff, #ff00e6); margin: 2rem auto 0; animation: pulse 1.5s infinite;"></div>
                </div>
            `;
            document.body.appendChild(mainDiv);
            document.body.style.overflow = 'auto';
            
            // Ajout de l'animation fadeInUp
            const styleAnim = document.createElement('style');
            styleAnim.textContent = `
                @keyframes fadeInUp {
                    from {
                        opacity: 0;
                        transform: translateY(30px);
                    }
                    to {
                        opacity: 1;
                        transform: translateY(0);
                    }
                }
            `;
            document.head.appendChild(styleAnim);
        }
        
        // Lancer la progression
        updateProgress();
        
        // Ajout d'un effet interactif : au survol du loader (optionnel)
        const loaderCircle = document.querySelector('.loader-circle');
        loaderCircle.addEventListener('mouseenter', () => {
            document.querySelector('.outer-ring').style.animationDuration = '0.9s';
            document.querySelector('.inner-ring').style.animationDuration = '0.6s';
        });
        loaderCircle.addEventListener('mouseleave', () => {
            document.querySelector('.outer-ring').style.animationDuration = '1.2s';
            document.querySelector('.inner-ring').style.animationDuration = '0.8s';
        });
        
        // Petite touche "wow" : changement de couleur du texte de pourcentage selon progression
        setInterval(() => {
            if (progress < 100) {
                const hue = (progress * 3.6) % 360;
                percentElement.style.textShadow = `0 0 12px hsl(${hue}, 100%, 60%)`;
                percentElement.style.color = `hsl(${hue}, 80%, 65%)`;
            }
        }, 100);
    })();
</script>
</body>
</html>
